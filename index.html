<!DOCTYPE html>
<html>
<head>
  <title>CWA Help Desk Appointment</title>
</head>
<body>
  <h2>CWA Help Desk Appointment</h2>
  <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
  <p>Check Blackboard for when CWA tutors will be there.</p>

  <form>
    <fieldset>
      <legend><strong>Student details</strong></legend>
      <label for="studentID">Student ID</label>
      <input type="text" id="studentID" name="studentID"><br><br>

      <label for="givenName">Given Name</label>
      <input type="text" id="givenName" name="givenName">

      <label for="familyName">Family Name</label>
      <input type="text" id="familyName" name="familyName">
    </fieldset>

    <br>

    <fieldset>
      <legend><strong>Your unit</strong></legend>
      <input type="radio" id="cos10011" name="unit" value="COS10011">
      <label for="cos10011">COS10011</label>

      <input type="radio" id="cos60004" name="unit" value="COS60004">
      <label for="cos60004">COS60004</label>

      <input type="radio" id="cos60007" name="unit" value="COS60007">
      <label for="cos60007">COS60007</label><br><br>

      <label for="tutor">Your Tutor</label>
      <select id="tutor" name="tutor">
        <option value="">Please Select</option>
        <option value="">Dr .Atie Kia</option>
        <option value="">Rahul Raghavan</option>
      </select>
    </fieldset>

    <br>

    <fieldset>
      <legend><strong>Issue</strong></legend>
      <input type="checkbox" id="html" name="issue" value="HTML">
      <label for="html">HTML</label>

      <input type="checkbox" id="css" name="issue" value="CSS">
      <label for="css">CSS</label>

      <input type="checkbox" id="javascript" name="issue" value="JavaScript">
      <label for="javascript">JavaScript</label>

      <input type="checkbox" id="php" name="issue" value="PHP">
      <label for="php">PHP</label>

      <input type="checkbox" id="mysql" name="issue" value="MySQL">
      <label for="mysql">MySQL</label><br><br>

      <label for="description">Description of Issue</label><br>
      <textarea id="description" placeholder = "Write description of your problem here..." name="description" rows="4" cols="50"></textarea>
    </fieldset>

    <br>

    <fieldset>
      <legend><strong>Preferred Date / Time</strong></legend>
      <label for="date">Date</label>
      <input type="date" id="date" name="date"><br><br>

      <label for="time">Time</label>
      <input type="time" id="time" name="time">
    </fieldset>

    <br>
    <button type="submit">Submit</button>
    <button type="reset">Reset Form</button>
  </form>
</body>
</html>
